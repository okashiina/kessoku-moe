# Two-way sync writes. SaveMediaListEntry upserts (creates if absent), so it
# covers "add to list", "update progress/status", and "rate". scoreRaw is the
# format-independent 0-100 score (AniList renders it in the viewer's own format).
# Requires an Authorization: Bearer <token> header (passed per-request from the
# client). The frontend keeps an inline copy of this in utility/anilistSync.ts.
mutation saveMediaListEntry(
  $mediaId: Int
  $status: MediaListStatus
  $progress: Int
  $scoreRaw: Int
) {
  SaveMediaListEntry(
    mediaId: $mediaId
    status: $status
    progress: $progress
    scoreRaw: $scoreRaw
  ) {
    id
    mediaId
    status
    progress
    score
    updatedAt
  }
}

# Removes a list entry by its MediaList entry id (NOT the media id).
mutation deleteMediaListEntry($id: Int) {
  DeleteMediaListEntry(id: $id) {
    deleted
  }
}
