name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Build (which type-checks via `next build`) and lint the monorepo.
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `turbo run build` builds every package; Next's build type-checks the app.
      - name: Build
        run: yarn build

      # `turbo run lint` runs next lint (reuses the cached build).
      - name: Lint
        run: yarn lint
